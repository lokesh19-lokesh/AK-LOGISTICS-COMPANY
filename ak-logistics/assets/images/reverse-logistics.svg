<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="rlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#143152"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#rlGrad)"/>

  <!-- Circular Loop Vector (Reverse Logistics) -->
  <g transform="translate(180, 70)">
    <!-- Circular Arrow Arc 1 -->
    <path d="M 120 40 A 80 80 0 0 1 200 120" fill="none" stroke="#0056b3" stroke-width="8" stroke-linecap="round"/>
    <polygon points="190,135 208,125 208,145" fill="#0056b3"/>
    
    <!-- Circular Arrow Arc 2 -->
    <path d="M 200 120 A 80 80 0 0 1 120 200" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Circular Arrow Arc 3 -->
    <path d="M 120 200 A 80 80 0 0 1 40 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <polygon points="50,105 32,115 32,95" fill="#10b981"/>

    <!-- Circular Arrow Arc 4 -->
    <path d="M 40 120 A 80 80 0 0 1 120 40" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Center Hub Box -->
    <circle cx="120" cy="120" r="42" fill="#07162c" stroke="#334155" stroke-width="3"/>
    <text x="120" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">REVERSE</text>
    <text x="120" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0056b3" text-anchor="middle">FLOW</text>
  </g>

  <!-- Labels -->
  <g transform="translate(60, 300)">
    <rect width="480" height="42" rx="8" fill="rgba(255,255,255,0.08)"/>
    <text x="240" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#cbd5e1" text-anchor="middle">Returns Processing • Warranty Verification • Recovery &amp; Recycling</text>
  </g>
</svg>
