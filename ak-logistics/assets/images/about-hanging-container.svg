<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <!-- Crane Hook & Ring -->
  <circle cx="100" cy="20" r="8" stroke="#64748b" stroke-width="4" fill="none"/>
  <path d="M100 28 V45" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 45 C96 55, 108 55, 108 48 C108 42, 102 40, 100 45" stroke="#1e293b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="56" r="4" fill="#0284c7"/>

  <!-- Steel Cables -->
  <line x1="100" y1="56" x2="25" y2="105" stroke="#64748b" stroke-width="2" stroke-dasharray="3 1"/>
  <line x1="100" y1="56" x2="65" y2="92" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="56" x2="145" y2="105" stroke="#64748b" stroke-width="2" stroke-dasharray="3 1"/>
  <line x1="100" y1="56" x2="185" y2="92" stroke="#475569" stroke-width="2"/>

  <!-- 3D Blue Shipping Container -->
  <!-- Top Face -->
  <polygon points="25,105 65,92 185,92 145,105" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <line x1="55" y1="95" x2="175" y2="95" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="45" y1="98" x2="165" y2="98" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="102" x2="155" y2="102" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Front Face (Corrugated) -->
  <polygon points="25,105 145,105 145,185 25,185" fill="#0056b3" stroke="#003d82" stroke-width="1.5"/>
  <!-- Front vertical corrugation lines -->
  <g stroke="#0284c7" stroke-width="2">
    <line x1="35" y1="106" x2="35" y2="184"/>
    <line x1="45" y1="106" x2="45" y2="184"/>
    <line x1="55" y1="106" x2="55" y2="184"/>
    <line x1="65" y1="106" x2="65" y2="184"/>
    <line x1="75" y1="106" x2="75" y2="184"/>
    <line x1="85" y1="106" x2="85" y2="184"/>
    <line x1="95" y1="106" x2="95" y2="184"/>
    <line x1="105" y1="106" x2="105" y2="184"/>
    <line x1="115" y1="106" x2="115" y2="184"/>
    <line x1="125" y1="106" x2="125" y2="184"/>
    <line x1="135" y1="106" x2="135" y2="184"/>
  </g>
  <!-- Corrugation shadow lines -->
  <g stroke="#002d62" stroke-width="1">
    <line x1="36" y1="106" x2="36" y2="184"/>
    <line x1="46" y1="106" x2="46" y2="184"/>
    <line x1="56" y1="106" x2="56" y2="184"/>
    <line x1="66" y1="106" x2="66" y2="184"/>
    <line x1="76" y1="106" x2="76" y2="184"/>
    <line x1="86" y1="106" x2="86" y2="184"/>
    <line x1="96" y1="106" x2="96" y2="184"/>
    <line x1="106" y1="106" x2="106" y2="184"/>
    <line x1="116" y1="106" x2="116" y2="184"/>
    <line x1="126" y1="106" x2="126" y2="184"/>
    <line x1="136" y1="106" x2="136" y2="184"/>
  </g>

  <!-- Side Right Face (Doors & Hinges) -->
  <polygon points="145,105 185,92 185,170 145,185" fill="#003d82" stroke="#002d62" stroke-width="1.5"/>
  <line x1="165" y1="98" x2="165" y2="177" stroke="#002244" stroke-width="1.5"/>
  <!-- Door locking bars -->
  <line x1="154" y1="102" x2="154" y2="181" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="174" y1="95" x2="174" y2="174" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Corner castings -->
  <rect x="23" y="103" width="6" height="8" fill="#e2e8f0" stroke="#475569" stroke-width="0.75" rx="1"/>
  <rect x="141" y="103" width="6" height="8" fill="#e2e8f0" stroke="#475569" stroke-width="0.75" rx="1"/>
  <rect x="23" y="177" width="6" height="8" fill="#e2e8f0" stroke="#475569" stroke-width="0.75" rx="1"/>
  <rect x="141" y="177" width="6" height="8" fill="#e2e8f0" stroke="#475569" stroke-width="0.75" rx="1"/>
  <rect x="181" y="90" width="6" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="0.75" rx="1"/>
  <rect x="181" y="164" width="6" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="0.75" rx="1"/>

  <!-- Container Details & Logo Text -->
  <text x="40" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">AK LOGISTICS</text>
  <text x="40" y="156" font-family="monospace" font-size="6" font-weight="bold" fill="#7dd3fc">AKLU 984021 [45G1]</text>
</svg>
