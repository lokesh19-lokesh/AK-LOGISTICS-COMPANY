<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162c"/>
      <stop offset="100%" stop-color="#142c4c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#ofGrad)"/>

  <!-- Conveyor System with Fulfillment Steps -->
  <g transform="translate(60, 160)">
    <!-- Conveyor Belt Track -->
    <rect y="80" width="480" height="18" rx="9" fill="#334155"/>
    <circle cx="20" cy="89" r="7" fill="#64748b"/>
    <circle cx="80" cy="89" r="7" fill="#64748b"/>
    <circle cx="160" cy="89" r="7" fill="#64748b"/>
    <circle cx="240" cy="89" r="7" fill="#64748b"/>
    <circle cx="320" cy="89" r="7" fill="#64748b"/>
    <circle cx="400" cy="89" r="7" fill="#64748b"/>
    <circle cx="460" cy="89" r="7" fill="#64748b"/>

    <!-- Box 1: Order Processing -->
    <g transform="translate(40, 10)">
      <rect width="65" height="65" rx="5" fill="#0056b3"/>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff">PICK</text>
    </g>

    <!-- Box 2: Custom Packaging -->
    <g transform="translate(180, -5)">
      <rect width="80" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#0056b3" stroke-width="6"/>
      <text x="18" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0d2342">PACK</text>
      <text x="16" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#64748b">BRANDED</text>
    </g>

    <!-- Box 3: QA & Dispatch -->
    <g transform="translate(340, 10)">
      <rect width="65" height="65" rx="5" fill="#10b981"/>
      <path d="M 22 34 L 29 41 L 44 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="14" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff">DISPATCH</text>
    </g>
  </g>

  <!-- Process Info Pill -->
  <g transform="translate(150, 40)">
    <rect width="300" height="48" rx="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <text x="150" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">Accurate Picking, Packing &amp; Returns</text>
  </g>
</svg>
