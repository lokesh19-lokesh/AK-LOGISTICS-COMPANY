<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#18365e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#vaGrad)"/>

  <!-- Value Added Service Blocks -->
  <g transform="translate(80, 80)">
    <!-- Card 1: Quality Inspection -->
    <g transform="translate(0, 0)">
      <rect width="200" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <circle cx="35" cy="45" r="18" fill="#10b981"/>
      <path d="M 27 45 L 32 50 L 43 38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">QA Inspection</text>
      <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Standards &amp; Verification</text>
    </g>

    <!-- Card 2: Cargo Handling & Palletizing -->
    <g transform="translate(240, 0)">
      <rect width="200" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <circle cx="35" cy="45" r="18" fill="#0056b3"/>
      <rect x="25" y="37" width="20" height="16" rx="2" fill="#ffffff"/>
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">Cargo Handling</text>
      <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Loading &amp; Palletizing</text>
    </g>

    <!-- Card 3: Compliance & Documentation -->
    <g transform="translate(0, 115)">
      <rect width="200" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <circle cx="35" cy="45" r="18" fill="#3b82f6"/>
      <rect x="26" y="34" width="18" height="22" rx="2" fill="#ffffff"/>
      <line x1="29" y1="39" x2="39" y2="39" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="29" y1="44" x2="39" y2="44" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">Documentation</text>
      <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Regulatory Compliance</text>
    </g>

    <!-- Card 4: Kitting & Custom Labeling -->
    <g transform="translate(240, 115)">
      <rect width="200" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
      <circle cx="35" cy="45" r="18" fill="#8b5cf6"/>
      <path d="M 27 45 L 35 37 L 43 45 L 35 53 Z" fill="#ffffff"/>
      <text x="65" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">Custom Kitting</text>
      <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Relabeling &amp; Bundling</text>
    </g>
  </g>
  <text x="300" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#cbd5e1" text-anchor="middle">Precision Value-Added Services Supporting Saudi Business Operations</text>
</svg>
