<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162c"/>
      <stop offset="100%" stop-color="#112746"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#tdGrad)"/>

  <!-- TMS Dashboard UI Frame -->
  <g transform="translate(60, 40)">
    <rect width="480" height="290" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="480" height="36" rx="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#0056b3"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#cbd5e1">AK LOGISTICS TMS — FLEET DISPATCH &amp; GPS TELEMATICS</text>

    <!-- Map View Area -->
    <g transform="translate(20, 50)">
      <rect width="280" height="210" rx="8" fill="#1e293b"/>
      <!-- Map Roads Grid -->
      <path d="M 30 180 Q 100 120 160 140 T 260 50" fill="none" stroke="#475569" stroke-width="8"/>
      <path d="M 30 180 Q 100 120 160 140 T 260 50" fill="none" stroke="#0056b3" stroke-width="3" stroke-dasharray="6,4"/>
      <!-- Active Truck Marker -->
      <circle cx="160" cy="140" r="14" fill="#0056b3" opacity="0.3"/>
      <circle cx="160" cy="140" r="8" fill="#0056b3"/>
      <text x="180" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#ffffff">Truck #AK-108 (In Transit)</text>
    </g>

    <!-- Sidebar Metrics -->
    <g transform="translate(315, 50)">
      <rect width="145" height="60" rx="6" fill="#1e293b"/>
      <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#94a3b8">ACTIVE DISPATCHES</text>
      <text x="12" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff">100% Monitored</text>

      <rect y="72" width="145" height="60" rx="6" fill="#1e293b"/>
      <text x="12" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#94a3b8">SYSTEM INTEGRATION</text>
      <text x="12" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#10b981">API / EDI Ready</text>

      <rect y="144" width="145" height="60" rx="6" fill="#1e293b"/>
      <text x="12" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#94a3b8">REPORTING</text>
      <text x="12" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#38bdf8">Live Telematics</text>
    </g>
  </g>
</svg>
