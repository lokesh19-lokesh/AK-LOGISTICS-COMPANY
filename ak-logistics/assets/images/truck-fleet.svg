<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07162c"/>
      <stop offset="100%" stop-color="#163663"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056b3"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#tGrad)"/>
  <!-- Road Horizon -->
  <polygon points="0,290 600,290 420,180 180,180" fill="#1b2a47"/>
  <polygon points="200,290 400,290 310,180 290,180" fill="#24375b"/>
  <line x1="300" y1="180" x2="300" y2="290" stroke="#0056b3" stroke-width="3" stroke-dasharray="10,10"/>
  <!-- Delivery Van in Foreground -->
  <g transform="translate(90, 150)">
    <!-- Shadow -->
    <ellipse cx="140" cy="95" rx="140" ry="8" fill="rgba(0,0,0,0.45)"/>
    <!-- Van Body -->
    <path d="M 20 15 L 180 15 L 230 45 L 240 85 L 20 85 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 175 22 L 218 45 L 175 45 Z" fill="#0d2342"/>
    <!-- Blue Accent Stripe -->
    <rect x="20" y="55" width="220" height="10" fill="#0056b3"/>
    <text x="35" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#0d2342">AK LOGISTICS</text>
    <text x="35" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" fill="#0056b3">LAST-MILE &amp; EXPRESS DELIVERY</text>
    <!-- Van Wheels -->
    <circle cx="65" cy="85" r="16" fill="#1e293b"/>
    <circle cx="65" cy="85" r="8" fill="#94a3b8"/>
    <circle cx="195" cy="85" r="16" fill="#1e293b"/>
    <circle cx="195" cy="85" r="8" fill="#94a3b8"/>
  </g>

  <!-- Delivery Courier Bike / Scooter on right -->
  <g transform="translate(370, 175)">
    <!-- Shadow -->
    <ellipse cx="65" cy="72" rx="60" ry="6" fill="rgba(0,0,0,0.4)"/>
    <!-- Delivery Box -->
    <rect x="15" y="10" width="36" height="34" rx="4" fill="#0056b3" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="20" y="24" width="26" height="6" fill="#ffffff"/>
    <!-- Scooter Body -->
    <path d="M 45 35 L 75 35 L 90 55 L 80 65 L 45 65 Z" fill="#ffffff"/>
    <path d="M 75 20 L 85 45 L 70 45 Z" fill="#0d2342"/>
    <line x1="72" y1="20" x2="88" y2="20" stroke="#0d2342" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="30" cy="65" r="12" fill="#1e293b"/>
    <circle cx="30" cy="65" r="6" fill="#94a3b8"/>
    <circle cx="100" cy="65" r="12" fill="#1e293b"/>
    <circle cx="100" cy="65" r="6" fill="#94a3b8"/>
  </g>
  <!-- Route badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="50" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="25" cy="25" r="10" fill="#0056b3"/>
    <text x="45" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff">Regional &amp; Cross-City</text>
    <text x="45" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Optimized Route Management</text>
  </g>
</svg>
